<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>SMART training</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="static/Dragonstone.png">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <div id="background"></div>
  <div id="app">
    <header id="header" class="header-plain" hidden>
      <div class="left-top">
        <img class="header-image" id="current-character" src="" alt="">
        <img class="header-image hidden" id="target-character" src="" alt="">
        <div class="text-container">
          <img src="static/speech_bubble.png" class="speech-bubble" alt="">
          <div id="dragon-motivation" class="Dragon-speech"></div>
        </div>
      </div>
      <div class="middle-top">
        <div class="level-text" id="level-display"></div>
        <div class="trial-text" id="trial-display"></div>
        <div id="stone-container" class="stone-container"></div>
      </div>
      <div class="right-top"><canvas id="timer-circle" width="100" height="100"></canvas></div>
    </header>
    <main id="screen">
      <div class="centered"><p>Loading…</p></div>
    </main>
    <footer id="session-footer" hidden>
      <div id="session-timer-container"><div id="session-timer-bar"></div></div>
      <div id="session-countdown"></div>
    </footer>
  </div>
  <div id="debug-panel" hidden></div>
  <script type="module" src="app/main.js"></script>
</body>
</html>
